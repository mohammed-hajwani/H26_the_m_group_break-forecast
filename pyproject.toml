[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "break-forecast"
version = "0.1.0"
description = "Agent Skill + CLI that tests dependency changes in a Python repo, repairs breakage with an open-weight model, and proves every result with execution evidence."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "packaging>=24.0",
    "jsonschema>=4.21",
    "uv>=0.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
bf = "break_forecast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
break_forecast = ["schema/*.json", "prompts/*.md", "assets/*.html", "web_dist/*.html", "web_dist/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
norecursedirs = ["fixtures"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
